name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Validate source and contracts in the Baobab environment
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/workspace"
          --workdir /workspace
          --env SKIP_COMPOSE_VALIDATION=1
          --env PYTHONPYCACHEPREFIX=/tmp/baobab-pyc
          ghcr.io/nabhold/baobab-dev:1.2.6
          bash scripts/validate.sh

  compose-validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose model
        env:
          DB_PASS: validation
          DB_ADMIN_PASS: validation
          BAOBAB_EVENT_SIGNING_SECRET: validation
        run: docker compose -f compose.yaml config --quiet

  build-extensions-and-image:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Baobab OSGi extension bundles
        run: mvn -q -B -f idempiere/extensions package
      - name: Build deployable ERP image
        run: docker build -f idempiere/Dockerfile -t baobab-erp:test .
