schema:
  name: "nabhold-development-environment-contract"
  version: "1.0"
application:
  name: "baobab-erp"
  version: "0.1.0"
environment:
  provider: "baobab-dev"
  profile: "full"
  minimum_version: "1.0.0"
  contract_minimum_version: "1.0"
compatibility_policy:
  strict_runtime_versions: false
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false
validation:
  required_capabilities:
    - "languages.python"
    - "languages.node"
    - "database.postgresql"
    - "package_managers.uv"
    - "development.docker"
    - "development.github_cli"
notes:
  - "Frappe runtime uses MariaDB. The PostgreSQL capability is inherited from the current shared full profile and is not the ERP runtime database."
