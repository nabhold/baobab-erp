# Honest per-ADR conformance ledger (ADR-ERP-020, Phase 30). This is checked in by hand
# and reviewed alongside every architecturally significant change; it is not generated
# from a coverage tool, so keep entries accurate rather than optimistic.
#
# status:
#   foundation - the decision has real, working code demonstrating the pattern
#   partial    - some of the decision is implemented and tested; a material gap remains
#   planned    - decided in the ADR, not yet implemented
schema_version: "1.0"
updated: "2026-09-06"
adrs:
  - id: ADR-ERP-001
    title: iDempiere as an isolated, headless, multi-tenant Baobab ERP engine
    status: foundation
    evidence:
      - idempiere/Dockerfile
      - compose.yaml
      - idempiere/extensions/
    gap: No production EngineInstance exists; no application-service HTTP layer yet.

  - id: ADR-ERP-002
    title: ERP tenant, client and organization mapping
    status: partial
    evidence:
      - db/migrations/0002_create_tenant_mapping.sql
      - modules/context/postgres_store.py
      - modules/application/server.py
      - tests/integration/test_postgres_context_store.py
      - idempiere/extensions/org.nabhold.baobab.erp.context/
    gap: >
      modules/context now resolves against a real Postgres-backed store, exercised
      end-to-end through the HTTP application layer and integration tests. The OSGi
      context bundle (idempiere/extensions) is still unwired and fails closed, since
      nothing inside iDempiere calls it yet -- that half needs a real extension point
      (event handler or model validator) invoking it, tracked here until built.

  - id: ADR-ERP-003
    title: ERP EngineInstance isolation, regional deployment and data residency
    status: planned
    evidence: []
    gap: No EngineInstance/IsolationProfile implementation exists in this repository yet; owned jointly with nabhold/baobab-cp.

  - id: ADR-ERP-004
    title: Baobab iDempiere extension architecture
    status: foundation
    evidence:
      - idempiere/extensions/org.nabhold.baobab.erp.context/
      - idempiere/extensions/org.nabhold.baobab.erp.mapping/
      - idempiere/patches/README.md
    gap: Only 2 of the 8 reserved namespaces have a bundle; the rest are unimplemented by design until there is a real extension point to fill.

  - id: ADR-ERP-005
    title: Baobab ERP integration API architecture
    status: partial
    evidence:
      - modules/integration/idempiere_client.py
      - modules/integration/delivery_transport.py
      - modules/application/server.py
      - tests/unit/test_idempiere_client.py
      - tests/integration/test_http_server.py
    gap: >
      The inbound HTTP server exists and is tested end-to-end (health checks, signed
      webhook receipt). RestIdempiereClient is now a real implementation (one-step JWT
      login, automatic token refresh, get/create/update against /models/{table}),
      verified against the com.trekglobal.idempiere.rest.api / bxservice/idempiere-rest
      OpenAPI spec and tested against a fake server reproducing that spec exactly --
      but not yet against a real running iDempiere instance, because that REST API
      plugin is not part of the pinned idempiereofficial/idempiere image and is not
      yet installed by idempiere/Dockerfile (see idempiere/README.md). Until that
      installation is wired up, no canonical operation can actually reach a live
      iDempiere; that remains the most consequential gap in this ADR.

  - id: ADR-ERP-006
    title: ERP canonical event architecture
    status: foundation
    evidence:
      - modules/events/envelope.py
      - modules/outbox/postgres_store.py
      - modules/inbox/postgres_store.py
      - modules/application/server.py
      - modules/application/dispatch_worker.py
      - modules/integration/delivery_transport.py
      - db/migrations/0004_create_event_outbox.sql
      - db/migrations/0005_create_event_inbox.sql
      - contracts/events/
      - tests/integration/test_postgres_outbox_store.py
      - tests/integration/test_postgres_inbox_store.py
      - tests/integration/test_http_server.py
    gap: >
      Record -> dispatch -> signed HTTP delivery -> mark-delivered, and
      receive -> verify -> deduplicate -> persist, are both proven end-to-end
      against a real Postgres database and real HTTP server (not just in-memory
      fakes). dispatch_worker.py runs to completion and exits rather than being a
      long-running daemon; it still needs an external scheduler (cron, systemd
      timer) wired in a real deployment, which is not yet automated in compose.yaml.

  - id: ADR-ERP-007
    title: ERP canonical entity and external reference mapping architecture
    status: partial
    evidence:
      - db/migrations/0003_create_entity_mapping.sql
      - modules/mapping/postgres_store.py
      - tests/integration/test_postgres_mapping_store.py
      - idempiere/extensions/org.nabhold.baobab.erp.mapping/
    gap: >
      modules/mapping now resolves canonical <-> native references against a real
      Postgres-backed store, tested end-to-end. The OSGi mapping bundle
      (idempiere/extensions) is still unwired and fails closed, same as the context
      bundle under ADR-ERP-002 -- it needs a real extension point inside iDempiere
      to call it.

  - id: ADR-ERP-008
    title: ERP financial, accounting and multi-currency architecture
    status: planned
    evidence: []
    gap: No LegalEntity accounting configuration (chart of accounts, fiscal calendar, tax setup) exists yet.

  - id: ADR-ERP-009
    title: ERP market localisation, jurisdiction and regulatory architecture
    status: planned
    evidence: []
    gap: Not started.

  - id: ADR-ERP-010
    title: ERP security, identity, authorization and tenant-isolation architecture
    status: partial
    evidence:
      - modules/security/signing.py
      - modules/context/resolver.py
      - modules/context/postgres_store.py
      - modules/identity/service.py
      - modules/application/server.py
      - tests/tenancy/test_context_resolver.py
      - tests/integration/test_http_server.py
    gap: >
      Fail-closed context resolution and HMAC signature verification are now proven
      against a real database and a real HTTP round trip (valid signature accepted,
      invalid signature rejected with 401, before the envelope is even parsed), not
      just in-memory fakes. There is still no real IdP/authentication integration;
      ServiceIdentity remains a data carrier only, and the HTTP layer has no
      authentication of its own beyond the event-signing secret.

  - id: ADR-ERP-011
    title: ERP observability, audit, reconciliation and operational control architecture
    status: partial
    evidence:
      - modules/reconciliation/record_counts.py
    gap: Only Layer 1 (record counts) reconciliation exists; Layers 2-4 and audit/observability tooling are not started.

  - id: ADR-ERP-012
    title: ERP high availability, backup, disaster recovery and business continuity architecture
    status: planned
    evidence: []
    gap: Not started.

  - id: ADR-ERP-013
    title: ERP deployment, release, upgrade and configuration management architecture
    status: partial
    evidence:
      - upstream.lock.yaml
      - compose.yaml
      - idempiere/Dockerfile
      - modules/Dockerfile
      - .trivyignore
    gap: >
      compose.yaml now builds and runs a baobab-app image (modules/) alongside
      iDempiere, with a one-shot baobab-db-migrate service applying db/migrations
      before it starts. modules/Dockerfile is not yet covered by the
      foundation/vulnerability-scan workflow (that workflow currently scans only
      idempiere/Dockerfile). No CI image publishing, upgrade rehearsal, or
      release-manifest tooling yet. .trivyignore documents a scoped, dated risk
      acceptance for HIGH/CRITICAL CVEs in third-party libraries vendored inside the
      pinned idempiereofficial/idempiere 13-release image (no fixed build exists
      upstream as of 2026-09-06); it must be re-reviewed whenever
      upstream.lock.yaml's iDempiere pin changes. Not yet wired: installing the
      com.trekglobal.idempiere.rest.api plugin (a Maven/Tycho build + p2 provisioning
      step, not a jar copy) that RestIdempiereClient needs a live instance to expose
      -- see idempiere/README.md and ADR-ERP-005.

